<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=outils.html">
    <meta name="description" content="Bienvenue sur Codex Prime, mon premier projet GitHub.">
    <title>Codex Prime — Accueil</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #101827;
        color: #f1f5f9;
        font-family: system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 680px;
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid #334155;
        border-radius: 24px;
        background: #182235;
      }
      .label { color: #93c5fd; font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 20px 0; font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.1; }
      p { color: #cbd5e1; line-height: 1.7; }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        border-radius: 10px;
        background: #93c5fd;
        color: #101827;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #bfdbfe; }
      a:focus-visible { outline: 3px solid #f1f5f9; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <span class="label">Mon premier projet GitHub</span>
      <h1>salut les scapiens et scapiennes</h1>
      <p>Redirection vers la page Outils vibe coding…</p>
      <a href="outils.html">Accéder aux outils vibe coding</a>
    </main>
  </body>
</html>
